groups:
  - name: tixflow
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Scrape target unavailable for 2 minutes'}
      - alert: ApiTechnicalErrors
        expr: sum(rate(http_requests_received_total{job="api",code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_received_total{job="api"}[5m])), 0.01) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'API technical errors exceed 1 percent'}
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Host filesystem has less than 15 percent free space'}
      - alert: MemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Host available memory below 10 percent'}
      - alert: QueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'RabbitMQ backlog persists for 5 minutes'}
      - alert: WaitingRoomQueueBacklog
        expr: max(tixflow_waiting_room_queue_depth{job="api"}) > 100
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Waiting room queue remains above 100 entries'}
      - alert: WaitingRoomControllerStalled
        expr: max(tixflow_waiting_room_active_policies{job="api"}) > 0 and time() - max(tixflow_waiting_room_controller_last_success_seconds{job="api"}) > 30
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Active waiting room controller has not completed a loop for 30 seconds'}
      - alert: WaitingRoomControllerErrors
        expr: sum(increase(tixflow_waiting_room_controller_failures_total{job="api"}[5m])) > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Waiting room controller encountered an error'}
