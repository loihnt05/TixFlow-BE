global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['api:8080']
  - job_name: keycloak
    static_configs:
      - targets: ['keycloak:9000']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
