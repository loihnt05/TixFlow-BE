# Disposable HTTP experiment, deliberately independent of development Compose/.env.
# Algorithm comparison: identical single API, resources and pool; admission limits off.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    cpus: 1
    mem_limit: 512m
    tmpfs: [/var/lib/postgresql/data]
    environment:
      POSTGRES_DB: tixflow_load_tests
      POSTGRES_USER: load
      POSTGRES_PASSWORD: disposable_load_only
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on, -c, max_connections=120, -c, shared_buffers=128MB]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U load -d tixflow_load_tests"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:628bd74c1c7e2a820bf417b32e75eed1bd8d517345d9749ee8bd4076ae393abe
    cpus: 1
    mem_limit: 512m
    tmpfs: [/var/lib/rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: load
      RABBITMQ_DEFAULT_PASS: disposable_load_only
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +A 4"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 15s
      retries: 30
  issuer:
    build:
      context: .
      dockerfile: infrastructure/load/Issuer/Dockerfile
    cpus: 0.5
    mem_limit: 256m
    environment:
      ASPNETCORE_URLS: http://+:8080
      Logging__LogLevel__Default: Warning
    volumes: ["${TIXFLOW_LOAD_PRIVATE:?required}:/state"]
  api:
    image: ${TIXFLOW_LOAD_IMAGE:?required}
    working_dir: /src/src/TixFlow.Api
    entrypoint: [dotnet, bin/Release/net8.0/TixFlow.Api.dll]
    cpus: 2
    mem_limit: 1g
    environment: &app
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=tixflow_load_tests;Username=load;Password=disposable_load_only;Maximum Pool Size=40;Timeout=10;Command Timeout=30
      Authentication__Authority: http://issuer:8080
      Authentication__MetadataAddress: http://issuer:8080/.well-known/openid-configuration
      Authentication__Audience: tixflow-api
      CatalogCache__Enabled: ${TIXFLOW_LOAD_CACHE:-false}
      TrafficLimits__Enabled: "false"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: load
      RabbitMq__Password: disposable_load_only
      Tickets__KeyDirectory: /state/qr
      Logging__LogLevel__Default: Warning
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.AspNetCore.Authentication: Warning
      Logging__LogLevel__Microsoft.AspNetCore.Authentication.JwtBearer: Warning
    volumes: ["${TIXFLOW_LOAD_PRIVATE:?required}:/state"]
  worker:
    image: ${TIXFLOW_LOAD_IMAGE:?required}
    working_dir: /src/src/TixFlow.Worker
    entrypoint: [dotnet, bin/Release/net8.0/TixFlow.Worker.dll]
    cpus: 0.5
    mem_limit: 512m
    environment: *app
    volumes: ["${TIXFLOW_LOAD_PRIVATE:?required}:/state"]
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    cpus: 0.25
    mem_limit: 64m
    volumes: ["./infrastructure/load/nginx.conf:/etc/nginx/nginx.conf:ro"]
  k6:
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    cpus: 2
    mem_limit: 1g
    user: "0:0"
    volumes:
      - ./load:/scripts:ro
      - ${TIXFLOW_LOAD_PRIVATE:?required}:/state:ro
      - ${TIXFLOW_LOAD_REPORT:?required}:/reports
    environment:
      BASE_URL: http://nginx:8080
      PROFILE: ${TIXFLOW_LOAD_PROFILE:-smoke}
      RUN_ID: ${TIXFLOW_LOAD_RUN_ID:?required}
      VUS: ${TIXFLOW_LOAD_VUS:-10}
      ITERATIONS: ${TIXFLOW_LOAD_ITERATIONS:-100}
    command: [run, --out, json=/reports/raw.json.gz, /scripts/scenarios.js]
