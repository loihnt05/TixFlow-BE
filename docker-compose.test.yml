name: tixflow-auth-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tixflow_auth_tests
      POSTGRES_USER: tixflow_test
      POSTGRES_PASSWORD: isolated_test_only
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/init/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_keycloak_identity.sql:/docker-entrypoint-initdb.d/002_keycloak_identity.sql:ro
      - ./database/migrations/003_catalog_management.sql:/docker-entrypoint-initdb.d/003_catalog_management.sql:ro
      - ./database/migrations/004_phase3_catalog_seed.sql:/docker-entrypoint-initdb.d/004_phase3_catalog_seed.sql:ro
      - ./database/migrations/005_phase4_inventory.sql:/docker-entrypoint-initdb.d/005_phase4_inventory.sql:ro
      - ./database/migrations/006_phase4_inventory_seed.sql:/docker-entrypoint-initdb.d/006_phase4_inventory_seed.sql:ro
      - ./database/migrations/007_phase5_hold_concurrency.sql:/docker-entrypoint-initdb.d/007_phase5_hold_concurrency.sql:ro
      - ./database/migrations/008_phase6_checkout_payments.sql:/docker-entrypoint-initdb.d/008_phase6_checkout_payments.sql:ro
      - ./database/migrations/009_phase7_worker_tickets.sql:/docker-entrypoint-initdb.d/009_phase7_worker_tickets.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixflow_test -d tixflow_auth_tests"]
      interval: 2s
      timeout: 5s
      retries: 20
  rabbitmq-test:
    image: rabbitmq:4-management-alpine
    user: "100:101"
    tmpfs:
      - /var/lib/rabbitmq:uid=100,gid=101,mode=0700
    environment:
      RABBITMQ_DEFAULT_USER: tixflow_test
      RABBITMQ_DEFAULT_PASS: isolated_test_only
    ports:
      - "127.0.0.1:15673:5672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 2s
      timeout: 5s
      retries: 30
