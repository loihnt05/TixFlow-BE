events { worker_connections 1024; }
http {
    # Edge IP limits are shared across both API replicas. Do not trust client X-Forwarded-For.
    limit_req_zone $binary_remote_addr zone=public_ip:10m rate=20r/s;
    limit_req_status 429;
    upstream tixflow_api {
        server api:8080;
        server api-replica:8080;
        keepalive 32;
    }
    server {
        listen 8080;
        client_max_body_size 1m;
        client_body_timeout 15s;
        keepalive_timeout 30s;
        error_page 429 = @limited;
        location @limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            return 429 '{"code":"RATE_LIMITED","retryable":true}';
        }
        location / {
            limit_req zone=public_ip burst=40 nodelay;
            proxy_pass http://tixflow_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
            proxy_send_timeout 30s;
            # Never retry a mutating request on another replica after an ambiguous response.
            proxy_next_upstream off;
        }
    }
}
