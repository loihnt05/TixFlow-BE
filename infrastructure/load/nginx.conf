events { worker_connections 2048; }
http {
    access_log off;
    upstream api_pool { server api:8080; keepalive 64; }
    server {
        listen 8080;
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_read_timeout 60s;
        }
    }
}
